name: Trigger auto deployment for flux-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/flux-backend-AutoDeployTrigger-776c2161-3644-4917-bb3c-b79e9c89fbdd.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FLUXBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FLUXBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FLUXBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: fluxacr987.azurecr.io
          registryUsername: fluxacr987
          registryPassword: 6HN0wk0ytZNujn2HwTfIHHOpJyQgd0tB6lXoQfM9hlvx7DSCVPibJQQJ99CFACGhslBEqg7NAAACAZCRGrfO
          containerAppName: flux-backend
          resourceGroup: flux-rg
          imageToBuild: fluxacr987.azurecr.io/flux-backend:${{ github.sha }}


