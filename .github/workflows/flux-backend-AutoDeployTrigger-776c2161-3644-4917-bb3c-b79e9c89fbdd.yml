name: Trigger auto deployment for flux-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/flux-backend-AutoDeployTrigger-776c2161-3644-4917-bb3c-b79e9c89fbdd.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FLUXBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FLUXBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FLUXBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: fluxacr987.azurecr.io
          username: fluxacr987
          password: 6HN0wk0ytZNujn2HwTfIHHOpJyQgd0tB6lXoQfM9hlvx7DSCVPibJQQJ99CFACGhslBEqg7NAAACAZCRGrfO

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            fluxacr987.azurecr.io/flux-backend:${{ github.sha }}
            fluxacr987.azurecr.io/flux-backend:latest

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: flux-backend
          resourceGroup: flux-rg
          imageToDeploy: fluxacr987.azurecr.io/flux-backend:${{ github.sha }}
          registryUrl: fluxacr987.azurecr.io
          registryUsername: fluxacr987
          registryPassword: 6HN0wk0ytZNujn2HwTfIHHOpJyQgd0tB6lXoQfM9hlvx7DSCVPibJQQJ99CFACGhslBEqg7NAAACAZCRGrfO



