<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flux</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 320px;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Inter", "Segoe UI", sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }

    .card {
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    .card::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 200px;
      background: radial-gradient(ellipse, rgba(204, 120, 92, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #cc785c 0%, #a05840 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(204, 120, 92, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(204, 120, 92, 0.4); }
      50%       { box-shadow: 0 8px 48px rgba(204, 120, 92, 0.7); }
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .tagline {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.02em;
    }

    /* Spinner */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(204, 120, 92, 0.7);
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1;   }
    }

    .loading-text {
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-icon">
        <!-- Flux "F" lightning bolt icon -->
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 2L6 20h10l-2 14 16-20H20z"/>
        </svg>
      </div>
      <div class="brand">Flux</div>
      <div class="tagline">Your AI research companion</div>
    </div>

    <div class="spinner-wrap">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="loading-text">Loading</div>
    </div>

    <div class="version" id="ver"></div>
  </div>
</body>
</html>
