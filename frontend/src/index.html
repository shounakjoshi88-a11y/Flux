<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#cc785c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flux" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Flux</title>
    
    <!-- Inter font for UI elements -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">

    <!-- Newsreader font for chat messages (crisp serif for screens) -->
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700;6..72,800&display=swap" rel="stylesheet">

    <!-- Cormorant Garamond display serif font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <!-- Zero-flicker theme script – must run before any rendering -->
    <script>
      (function() {
        const stored = localStorage.getItem("flux-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored === "light"
          ? "light"
          : (stored === "dark" || prefersDark ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("light", theme === "light");
        localStorage.setItem("flux-theme", theme);
      })();
    </script>

    <!-- Node.js process polyfill for browser bundles -->
    <script>window.process = window.process || { env: { NODE_ENV: 'production' }, browser: true, version: '' };</script>

    <!-- SpeechSynthesis feature detection - only polyfill if genuinely absent (not on Android WebView which has it) -->
    <script>
      (function() {
        if (typeof speechSynthesis === 'undefined' || !window.speechSynthesis) {
          window.speechSynthesis = {
            speak: function(){}, cancel: function(){}, pause: function(){}, resume: function(){},
            getVoices: function(){ return []; },
            addEventListener: function(){}, removeEventListener: function(){}, dispatchEvent: function(){ return false; },
            pending: false, speaking: false, paused: false, onvoiceschanged: null
          };
        }
        // Ensure getVoices can be called safely - trigger voice loading
        try {
          if (window.speechSynthesis && typeof window.speechSynthesis.getVoices === 'function') {
            window.speechSynthesis.getVoices();
          }
        } catch(e) {}
      })();
    </script>

    <!-- Minimal error overlay – production shows a tiny toast, dev shows details -->
    <script>
      (function() {
        var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        window.addEventListener("error", function(e) {
          console.error(e);
          if (!isDev) return;
          var d = document.createElement("div");
          d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#c64545;color:#fff;padding:12px 16px;font-size:12px;font-family:monospace;z-index:99999;max-height:30vh;overflow:auto";
          d.textContent = e.message;
          document.body.appendChild(d);
        });
        window.addEventListener("unhandledrejection", function(e) {
          console.error(e);
        });
        window.fluxLog = function(){};
      })();
    </script>

    <!-- Advanced Rendering Support -->
    <!-- TikZ support via TikZJax -->
    <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
    <script src="https://tikzjax.com/v1/tikzjax.js" defer></script>
    <!-- KaTeX extensions loaded via bundled katex package -->

    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"><div id="root-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#181715;font-family:Inter,sans-serif;flex-direction:column;gap:16px"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cc785c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.8"><path d="M2 16C5 6 8 18 11 10S17 6 22 12"/></svg><span style="font-size:24px;font-family:'Cormorant Garamond',serif;color:#faf9f5;letter-spacing:-0.5px">Flux</span><span style="font-size:13px;color:#6c6a64;letter-spacing:0.3px">Thinking partner</span></div></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
