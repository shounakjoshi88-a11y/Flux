<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cc785c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flux" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Flux</title>
    
    <!-- Inter font for UI elements -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">

    <!-- Newsreader font for chat messages (crisp serif for screens) -->
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700;6..72,800&display=swap" rel="stylesheet">

    <!-- Cormorant Garamond display serif font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <!-- Zero-flicker theme script – must run before any rendering -->
    <script>
      (function() {
        const stored = localStorage.getItem("flux-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored === "light"
          ? "light"
          : (stored === "dark" || prefersDark ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("light", theme === "light");
        localStorage.setItem("flux-theme", theme);
      })();
    </script>

    <!-- Node.js process polyfill for browser bundles -->
    <script>window.process = window.process || { env: { NODE_ENV: 'production' }, browser: true, version: '' };</script>

    <!-- Advanced Rendering Support -->
    <!-- TikZ support via TikZJax -->
    <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
    <script src="https://tikzjax.com/v1/tikzjax.js" defer></script>
    <!-- KaTeX extensions loaded via bundled katex package -->

    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"><div id="root-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#181715;color:#cc785c;font-family:system-ui,sans-serif;font-size:24px;font-weight:600">Flux</div></div>
    <script>
      if ("serviceWorker" in navigator && !location.hostname.startsWith("localhost") && location.hostname !== "127.0.0.1") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
